; Copy this file to data/config.ini, then run: pio run --target uploadfs

[wifi]
ssid = YOUR_WIFI_NETWORK
password = YOUR_WIFI_PASSWORD

[mqtt]
host = mqtt.local
port = 1883
username =
password =
base_topic = rv

[display]
temperature_unit = F
expected_poll_interval_seconds = 60
sleep_after_seconds = 300
show_brightness = 1
show_wifi = 1

[logging]
serial_level = INFO